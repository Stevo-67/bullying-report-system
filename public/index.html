<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bullying Report System - Student Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #090d16; --card-bg: rgba(22, 30, 46, 0.75); --card-border: rgba(255, 255, 255, 0.08); --accent-blue: #3b82f6; --text-main: #f1f5f9; --text-muted: #64748b; --danger: #f43f5e; --success: #10b981; --warning: #f59e0b; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background-color: var(--bg-dark); background-image: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; }
    .top-bar { width: 100%; max-width: 520px; display: flex; justify-content: flex-end; margin-bottom: 1rem; }
    .connection-badge { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; font-weight: 600; background: var(--card-bg); border: 1px solid var(--card-border); padding: 0.35rem 0.75rem; border-radius: 9999px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--text-muted); }
    .dot.online { background-color: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.reconnecting { background-color: var(--warning); box-shadow: 0 0 8px var(--warning); }
    .container { width: 100%; max-width: 520px; background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 1rem; padding: 2rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.375rem; }
    input, select, textarea { width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--card-border); color: var(--text-main); padding: 0.75rem 1rem; border-radius: 0.5rem; outline: none; font-size: 0.9rem; }
    .checkbox-group { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.5rem; }
    .checkbox-group input { width: auto; }
    button.btn-primary { width: 100%; background: var(--accent-blue); color: white; border: none; padding: 0.85rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .overlay-screen { display: none; position: fixed; inset: 0; background: rgba(9, 13, 22, 0.95); z-index: 1000; justify-content: center; align-items: center; text-align: center; padding: 2rem; }
    .overlay-card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 2.5rem; border-radius: 1rem; max-width: 450px; }
    #announcements-container { margin-bottom: 1.5rem; border-left: 3px solid var(--accent-blue); padding: 1rem; display: none; background: rgba(59,130,246,0.05); border-radius: 0.5rem; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="connection-badge">
      <div id="conn-dot" class="dot reconnecting"></div>
      <span id="conn-text">Connecting...</span>
    </div>
  </div>

  <div id="status-overlay" class="overlay-screen">
    <div class="overlay-card">
      <h2 id="overlay-title" style="color: var(--danger); margin-bottom: 1rem;">Portal Unavailable</h2>
      <p id="overlay-message" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>
      <div id="appeal-section" style="display: none;">
        <textarea id="appeal-reason" placeholder="State your appeal reason..." rows="3" style="margin-bottom: 1rem;"></textarea>
        <button class="btn-primary" onclick="submitAppeal()">Submit Appeal</button>
      </div>
    </div>
  </div>

  <div class="container">
    <h1>Bullying Report Portal</h1>
    <p class="subtitle">Securely report incidents to campus counselors.</p>

    <div id="announcements-container">
      <h4 style="color: var(--accent-blue); margin-bottom: 0.5rem;">📢 Campus Announcements</h4>
      <div id="announcements-list" style="font-size: 0.85rem; color: var(--text-muted); display:flex; flex-direction:column; gap:0.5rem;"></div>
    </div>

    <div id="auth-box">
      <div class="form-group"><label>Admission Number</label><input type="text" id="adm-no" placeholder="e.g. ADM-1024"></div>
      <div class="form-group"><label>Account PIN</label><input type="password" id="adm-pin" placeholder="Enter 4-digit PIN"></div>
      <button class="btn-primary" onclick="authenticateStudent()">Verify Student Account</button>
    </div>

    <div id="report-box" style="display: none;">
      <div class="form-group"><label>Category</label><select id="category"><option value="Bullying">Bullying / Harassment</option><option value="Cyberbullying">Cyberbullying</option><option value="Safety Risk">Campus Safety Risk</option><option value="Counseling">Personal Counseling Request</option></select></div>
      <div class="form-group"><label>Urgency Level</label><select id="urgency"><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select></div>
      <div class="form-group"><label>Incident Details</label><textarea id="description" rows="4" placeholder="Provide details about the incident..."></textarea></div>
      <div class="form-group checkbox-group"><input type="checkbox" id="is-anonymous"><label for="is-anonymous">Submit Anonymously</label></div>
      <button class="btn-primary" onclick="submitReport()" style="margin-top: 1rem;">Submit Incident Report</button>
    </div>
  </div>

  <script>
    if (!localStorage.getItem('device_id')) localStorage.setItem('device_id', 'DEV-' + crypto.randomUUID());
    const deviceId = localStorage.getItem('device_id');
    let currentStudentAdm = '';

    async function fetchAnnouncements() {
      try {
        const res = await fetch('/api/announcements');
        const data = await res.json();
        if (data.length > 0) {
          document.getElementById('announcements-container').style.display = 'block';
          document.getElementById('announcements-list').innerHTML = data.map(ann => 
            `<div><strong style="color: var(--text-main);">${escapeHtml(ann.title)}:</strong> ${escapeHtml(ann.message)}</div>`
          ).join('');
        }
      } catch (err) {}
    }

    function initConnection() {
      const evtSource = new EventSource('/api/events');
      evtSource.onopen = () => { document.getElementById('conn-dot').className = 'dot online'; document.getElementById('conn-text').innerText = 'Connected'; };
      evtSource.onerror = () => { document.getElementById('conn-dot').className = 'dot reconnecting'; document.getElementById('conn-text').innerText = 'Reconnecting...'; evtSource.close(); setTimeout(initConnection, 5000); };
    }

    async function checkSystemState() {
      try {
        const res = await fetch('/api/maintenance-status');
        const data = await res.json();
        if (data.maintenance) showOverlay('Maintenance Mode Active', 'The reporting portal is offline for maintenance.');
      } catch (err) {}
    }

    async function authenticateStudent() {
      const admNo = document.getElementById('adm-no').value.trim();
      const pin = document.getElementById('adm-pin').value.trim();
      if (!admNo || !pin) return alert('Enter Admission Number and PIN.');

      try {
        const res = await fetch('/api/student/auth', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-device-id': deviceId }, body: JSON.stringify({ admission_number: admNo, pin }) });
        const data = await res.json();

        if (res.status === 403) return showOverlay('Access Restricted', data.error, true);
        if (!res.ok) return alert(data.error || 'Authentication failed.');

        currentStudentAdm = admNo.toUpperCase();
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('report-box').style.display = 'block';
      } catch (err) { alert('Network error.'); }
    }

    async function submitReport() {
      const category = document.getElementById('category').value;
      const urgency = document.getElementById('urgency').value;
      const description = document.getElementById('description').value.trim();
      const isAnonymous = document.getElementById('is-anonymous').checked;

      if (!description) return alert('Please enter details.');

      try {
        const res = await fetch('/api/reports', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-device-id': deviceId }, body: JSON.stringify({ admission_number: currentStudentAdm, category, urgency, description, is_anonymous: isAnonymous }) });
        const data = await res.json();

        if (res.status === 403) return showOverlay('Access Restricted', data.error, true);
        if (res.ok) { alert('Report submitted successfully.'); document.getElementById('description').value = ''; }
        else { alert(data.error || 'Submission failed.'); }
      } catch (err) { alert('Connection error.'); }
    }

    async function submitAppeal() {
      const reason = document.getElementById('appeal-reason').value.trim();
      const admNo = document.getElementById('adm-no').value.trim() || currentStudentAdm || 'ANONYMOUS';
      if (!reason) return alert('State your reason.');
      try {
        const res = await fetch('/api/request-reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clientId: admNo, device_id: deviceId, reason }) });
        if (res.ok) { alert('Appeal logged.'); document.getElementById('appeal-reason').value = ''; }
      } catch (err) { alert('Appeal submission failed.'); }
    }

    function showOverlay(title, message, showAppeal = false) {
      document.getElementById('overlay-title').innerText = title;
      document.getElementById('overlay-message').innerText = message;
      document.getElementById('appeal-section').style.display = showAppeal ? 'block' : 'none';
      document.getElementById('status-overlay').style.display = 'flex';
    }

    function escapeHtml(str) { return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

    document.addEventListener('DOMContentLoaded', () => {
      checkSystemState();
      fetchAnnouncements();
      initConnection();
    });
  </script>
</body>
</html>
