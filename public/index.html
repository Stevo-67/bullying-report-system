<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Reporting Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(22, 30, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --accent-blue-glow: rgba(59, 130, 246, 0.4);
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --danger: #f43f5e;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    
    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 2.25rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: var(--accent-blue);
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    h1 { font-size: 1.65rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.35rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.75rem; line-height: 1.5; }

    #status-banner { margin-bottom: 1.5rem; }
    .alert-box {
      padding: 1rem;
      border-radius: 0.625rem;
      font-size: 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .alert-box.cooldown { background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.3); color: #fca5a5; }
    .alert-box.warning { background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.3); color: #fde68a; }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.825rem; font-weight: 600; margin-bottom: 0.4rem; color: #cbd5e1; }
    
    input, select, textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.8rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }

    textarea { resize: vertical; min-height: 110px; }

    /* Lively Animated Buttons */
    button {
      position: relative;
      overflow: hidden;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 20px -5px var(--accent-blue-glow);
      filter: brightness(1.15);
    }

    button:active:not(:disabled) {
      transform: translateY(-1px) scale(0.98);
      box-shadow: 0 4px 10px -2px rgba(59, 130, 246, 0.3);
    }

    button.btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 0.875rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    button.btn-appeal { background: var(--warning); color: #0f172a; margin-top: 0.5rem; }

    /* Modal Styling */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); justify-content: center; align-items: center; padding: 1rem; z-index: 50; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 0.75rem; padding: 1.75rem; width: 100%; max-width: 450px; }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
    .modal-actions button { width: 50%; padding: 0.65rem; border-radius: 0.375rem; font-size: 0.85rem; font-weight: 600; }
    .modal-actions button.btn-cancel { background: transparent; border: 1px solid var(--card-border); color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-badge">🛡️ Student Incident Portal</div>
    <h1>Report an Incident</h1>
    <p class="subtitle">Submit a safe, confidential report. First-time users establish a private PIN.</p>

    <div id="status-banner"></div>

    <form id="report-form" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="adm_no">Admission Number / Student ID</label>
        <input type="text" id="adm_no" placeholder="e.g., ADM-102" onchange="checkAccountStatus()" required>
      </div>

      <div class="form-group">
        <label for="student_pin">Private PIN (4–6 digits)</label>
        <small style="color: var(--text-muted); display: block; margin-bottom: 0.35rem; font-size: 0.75rem;">If first time, this PIN becomes your secret account password.</small>
        <input type="password" id="student_pin" maxlength="6" placeholder="Enter or create PIN" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="Bullying & Harassment">Bullying & Harassment</option>
          <option value="Academic Dishonesty">Academic Dishonesty</option>
          <option value="Property Damage">Property Damage</option>
          <option value="Safety Concerns">Safety Concerns</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="urgency">Urgency Level</label>
        <select id="urgency" required>
          <option value="Low">Low Priority</option>
          <option value="Medium" selected>Medium Priority</option>
          <option value="High">High Priority (Immediate Action)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Detailed Incident Description</label>
        <textarea id="description" placeholder="Provide factual details..." required></textarea>
      </div>

      <button type="submit" id="submit-btn" class="btn-submit">Submit Incident Report</button>
    </form>
  </div>

  <!-- Appeal Modal -->
  <div id="appeal-modal" class="modal-overlay">
    <div class="modal">
      <h2 style="font-size: 1.25rem;">Submit Account Appeal</h2>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0.5rem 0 1rem 0;">Provide context for school counselors to review your account status.</p>
      <div class="form-group">
        <label for="appeal-reason">Reason for Appeal</label>
        <textarea id="appeal-reason" placeholder="Explain circumstances..." required></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeAppealModal()">Cancel</button>
        <button type="button" class="btn-submit" onclick="sendAppeal()">Submit</button>
      </div>
    </div>
  </div>

  <script>
    let isSubmitting = false;

    // Offline Auto-Sync Listener
    window.addEventListener('online', syncOfflineReports);

    async function syncOfflineReports() {
      const queue = JSON.parse(localStorage.getItem('offline_reports') || '[]');
      if (queue.length === 0) return;

      let syncedCount = 0;
      for (let i = queue.length - 1; i >= 0; i--) {
        try {
          const res = await fetch('/api/reports', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(queue[i])
          });
          if (res.ok) {
            queue.splice(i, 1);
            syncedCount++;
          }
        } catch (e) {
          break; // Still offline
        }
      }

      localStorage.setItem('offline_reports', JSON.stringify(queue));
      if (syncedCount > 0) {
        alert(`${syncedCount} offline report(s) auto-submitted successfully!`);
      }
    }

    async function checkAccountStatus() {
      const admNo = document.getElementById('adm_no').value.trim();
      if (!admNo) return;

      const banner = document.getElementById('status-banner');
      try {
        const res = await fetch(`/api/client-status/${encodeURIComponent(admNo)}`);
        const data = await res.json();

        if (data.status === 'cooldown') {
          banner.innerHTML = `
            <div class="alert-box cooldown">
              <strong>⚠️ Account Restricted</strong>
              <span>This student account is banned across all devices.</span>
              <button type="button" class="btn-submit btn-appeal" onclick="openAppealModal()">Submit Ban Appeal</button>
            </div>
          `;
        } else if (data.status === 'warned') {
          banner.innerHTML = `
            <div class="alert-box warning">
              <strong>⚠️ Counselor Warning Issued</strong>
              <span>"${escapeHtml(data.message)}"</span>
            </div>
          `;
        } else {
          banner.innerHTML = '';
        }
      } catch (err) {
        console.error('Status check failed:', err);
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();

      if (isSubmitting) return;

      const admNo = document.getElementById('adm_no').value.trim();
      const pin = document.getElementById('student_pin').value.trim();
      const category = document.getElementById('category').value;
      const urgency = document.getElementById('urgency').value;
      const description = document.getElementById('description').value.trim();
      const submitBtn = document.getElementById('submit-btn');

      // Offline Storage Queue
      if (!navigator.onLine) {
        const queue = JSON.parse(localStorage.getItem('offline_reports') || '[]');
        queue.push({ admission_number: admNo, category, urgency, description });
        localStorage.setItem('offline_reports', JSON.stringify(queue));
        alert('No network connection. Report saved locally and will auto-submit when Wi-Fi returns!');
        document.getElementById('report-form').reset();
        return;
      }

      isSubmitting = true;
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      try {
        // 1. Authenticate or Set PIN
        const authRes = await fetch('/api/student/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admission_number: admNo, pin })
        });

        const authData = await authRes.json();

        if (!authRes.ok) {
          alert(authData.error || 'Authentication failed.');
          return;
        }

        // 2. Submit Report
        const reportRes = await fetch('/api/reports', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admission_number: admNo, category, urgency, description })
        });

        if (reportRes.ok) {
          alert('Report submitted successfully.');
          document.getElementById('report-form').reset();
          document.getElementById('status-banner').innerHTML = '';
        } else {
          const errData = await reportRes.json();
          alert(errData.error || 'Failed to submit report.');
        }
      } catch (err) {
        console.error('Submission error:', err);
        alert('An unexpected error occurred. Please try again.');
      } finally {
        isSubmitting = false;
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Incident Report';
      }
    }

    function openAppealModal() { document.getElementById('appeal-modal').classList.add('active'); }
    function closeAppealModal() { document.getElementById('appeal-modal').classList.remove('active'); }

    async function sendAppeal() {
      const admNo = document.getElementById('adm_no').value.trim();
      const reason = document.getElementById('appeal-reason').value.trim();

      if (!admNo || !reason) {
        alert('Admission number and appeal reason are required.');
        return;
      }

      const res = await fetch('/api/request-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientId: admNo, reason })
      });

      if (res.ok) {
        alert('Appeal submitted to school administrators.');
        closeAppealModal();
      } else {
        alert('Failed to send appeal.');
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
