<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Reporting Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .container { width: 100%; max-width: 600px; background: var(--card); border: 1px solid var(--border); border-radius: 0.75rem; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    
    #status-banner { margin-bottom: 1.5rem; }
    .alert-box { padding: 1rem; border-radius: 0.5rem; font-size: 0.875rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .alert-box.cooldown { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); }
    .alert-box.warning { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warning); }
    .alert-box.success { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.375rem; color: var(--text-muted); }
    input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.75rem; border-radius: 0.375rem; font-size: 0.875rem; outline: none; }
    textarea { resize: vertical; min-height: 100px; }
    button { width: 100%; background: var(--primary); color: white; border: none; padding: 0.75rem; border-radius: 0.375rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
    button.btn-appeal { background: var(--warning); color: #0f172a; margin-top: 0.5rem; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; padding: 1rem; z-index: 50; }
    .modal-overlay.active { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem; width: 100%; max-width: 450px; }
    .modal-actions { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .modal-actions button.btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Report an Incident</h1>
    <p class="subtitle">Submit a confidential report. First-time users will establish a private PIN.</p>

    <div id="status-banner"></div>

    <form id="report-form" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="adm_no">Admission Number / Student ID</label>
        <input type="text" id="adm_no" placeholder="e.g., ADM-102" onchange="checkAccountStatus()" required>
      </div>

      <div class="form-group">
        <label for="student_pin">Private PIN (4–6 digits)</label>
        <small style="color: var(--text-muted); display: block; margin-bottom: 0.25rem;">If first time, this PIN will become your account password.</small>
        <input type="password" id="student_pin" maxlength="6" placeholder="Enter or set your PIN" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" required>
          <option value="Bullying & Harassment">Bullying & Harassment</option>
          <option value="Academic Dishonesty">Academic Dishonesty</option>
          <option value="Property Damage">Property Damage</option>
          <option value="Safety Concerns">Safety Concerns</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="urgency">Urgency Level</label>
        <select id="urgency" required>
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High (Immediate Safety)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Detailed Description</label>
        <textarea id="description" placeholder="Provide full details..." required></textarea>
      </div>

      <button type="submit" id="submit-btn">Submit Report</button>
    </form>
  </div>

  <!-- Appeal Modal -->
  <div id="appeal-modal" class="modal-overlay">
    <div class="modal">
      <h2>Submit Ban Appeal</h2>
      <p style="color: var(--text-muted); font-size: 0.875rem; margin: 0.5rem 0 1rem 0;">Explain why your account restriction should be reviewed by school counselors.</p>
      <div class="form-group">
        <label for="appeal-reason">Reason for Appeal</label>
        <textarea id="appeal-reason" placeholder="Type reason..." required></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" onclick="closeAppealModal()">Cancel</button>
        <button type="button" onclick="sendAppeal()">Submit Appeal</button>
      </div>
    </div>
  </div>

  <script>
    async function checkAccountStatus() {
      const admNo = document.getElementById('adm_no').value.trim();
      if (!admNo) return;

      const banner = document.getElementById('status-banner');
      try {
        const res = await fetch(`/api/client-status/${encodeURIComponent(admNo)}`);
        const data = await res.json();

        if (data.status === 'cooldown') {
          banner.innerHTML = `
            <div class="alert-box cooldown">
              <strong>⚠️ Account Restricted</strong>
              <span>This student account is banned across all devices.</span>
              <button type="button" class="btn-appeal" onclick="openAppealModal()">Submit Ban Appeal</button>
            </div>
          `;
        } else if (data.status === 'warned') {
          banner.innerHTML = `
            <div class="alert-box warning">
              <strong>⚠️ Counselor Warning Issued</strong>
              <span>"${escapeHtml(data.message)}"</span>
            </div>
          `;
        } else {
          banner.innerHTML = '';
        }
      } catch (err) {
        console.error('Status check failed:', err);
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const admNo = document.getElementById('adm_no').value.trim();
      const pin = document.getElementById('student_pin').value.trim();
      const category = document.getElementById('category').value;
      const urgency = document.getElementById('urgency').value;
      const description = document.getElementById('description').value.trim();
      const submitBtn = document.getElementById('submit-btn');

      submitBtn.disabled = true;

      // 1. Authenticate or Set PIN
      const authRes = await fetch('/api/student/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admission_number: admNo, pin })
      });

      const authData = await authRes.json();

      if (!authRes.ok) {
        alert(authData.error || 'Authentication failed.');
        submitBtn.disabled = false;
        return;
      }

      // 2. Submit Report
      const reportRes = await fetch('/api/reports', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admission_number: admNo, category, urgency, description })
      });

      if (reportRes.ok) {
        alert('Report submitted successfully.');
        document.getElementById('report-form').reset();
        document.getElementById('status-banner').innerHTML = '';
      } else {
        const errData = await reportRes.json();
        alert(errData.error || 'Failed to submit report.');
      }

      submitBtn.disabled = false;
    }

    function openAppealModal() { document.getElementById('appeal-modal').classList.add('active'); }
    function closeAppealModal() { document.getElementById('appeal-modal').classList.remove('active'); }

    async function sendAppeal() {
      const admNo = document.getElementById('adm_no').value.trim();
      const reason = document.getElementById('appeal-reason').value.trim();

      if (!admNo || !reason) {
        alert('Admission number and appeal reason are required.');
        return;
      }

      const res = await fetch('/api/request-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ clientId: admNo, reason })
      });

      if (res.ok) {
        alert('Appeal submitted to school administrators.');
        closeAppealModal();
      } else {
        alert('Failed to send appeal.');
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
