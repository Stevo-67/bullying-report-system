<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Incident Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(22, 30, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --accent-blue-glow: rgba(59, 130, 246, 0.4);
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --danger: #f43f5e;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.375rem; }
    
    input, select, textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      outline: none;
      font-size: 0.9rem;
    }
    
    input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); box-shadow: 0 0 10px var(--accent-blue-glow); }

    .checkbox-group { display: flex; align-items: center; gap: 0.6rem; margin-top: 0.5rem; }
    .checkbox-group input { width: auto; cursor: pointer; }
    .checkbox-group label { text-transform: none; font-size: 0.875rem; color: var(--text-main); cursor: pointer; margin: 0; }

    button {
      width: 100%;
      background: var(--accent-blue);
      color: white;
      border: none;
      padding: 0.85rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 8px 16px var(--accent-blue-glow); }

    .overlay-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.95);
      backdrop-filter: blur(20px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .overlay-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 2.5rem;
      border-radius: 1rem;
      max-width: 450px;
    }
  </style>
</head>
<body>

  <!-- MAINTENANCE / BAN OVERLAY -->
  <div id="status-overlay" class="overlay-screen">
    <div class="overlay-card">
      <h2 id="overlay-title" style="color: var(--danger); margin-bottom: 1rem;">Portal Unavailable</h2>
      <p id="overlay-message" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>
      <div id="appeal-section" style="display: none;">
        <textarea id="appeal-reason" placeholder="State your appeal reason..." rows="3" style="margin-bottom: 1rem;"></textarea>
        <button onclick="submitAppeal()">Submit Appeal</button>
      </div>
    </div>
  </div>

  <div class="container">
    <h1>Incident Report Portal</h1>
    <p class="subtitle">Securely report issues to campus counselors.</p>

    <!-- AUTHENTICATION FORM -->
    <div id="auth-box">
      <div class="form-group">
        <label>Admission Number</label>
        <input type="text" id="adm-no" placeholder="e.g. ADM-1024">
      </div>
      <div class="form-group">
        <label>Account PIN</label>
        <input type="password" id="adm-pin" placeholder="Enter 4-digit PIN">
      </div>
      <button onclick="authenticateStudent()">Login / Verify Account</button>
    </div>

    <!-- REPORTING FORM -->
    <div id="report-box" style="display: none;">
      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option value="Bullying">Bullying / Harassment</option>
          <option value="Cyberbullying">Cyberbullying</option>
          <option value="Safety Risk">Campus Safety Risk</option>
          <option value="Counseling">Personal Counseling Request</option>
        </select>
      </div>

      <div class="form-group">
        <label>Urgency Level</label>
        <select id="urgency">
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>
      </div>

      <div class="form-group">
        <label>Incident Details</label>
        <textarea id="description" rows="4" placeholder="Provide details about the incident..."></textarea>
      </div>

      <div class="form-group checkbox-group">
        <input type="checkbox" id="is-anonymous">
        <label for="is-anonymous">Submit Anonymously (Hide ID from counselors)</label>
      </div>

      <button onclick="submitReport()" style="margin-top: 1rem;">Submit Report</button>
    </div>
  </div>

  <script>
    // Initialize Browser Device Fingerprint
    if (!localStorage.getItem('device_id')) {
      localStorage.setItem('device_id', 'DEV-' + crypto.randomUUID());
    }
    const deviceId = localStorage.getItem('device_id');

    let currentStudentAdm = '';

    async function checkSystemState() {
      try {
        const res = await fetch('/api/maintenance-status');
        const data = await res.json();
        if (data.maintenance) {
          showOverlay('Maintenance Mode Active', 'The reporting portal is currently offline for scheduled maintenance. Please check back shortly.');
        }
      } catch (err) {
        console.error('System status check error:', err);
      }
    }

    async function authenticateStudent() {
      const admNo = document.getElementById('adm-no').value.trim();
      const pin = document.getElementById('adm-pin').value.trim();

      if (!admNo || !pin) return alert('Enter both Admission Number and PIN.');

      try {
        const res = await fetch('/api/student/auth', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-device-id': deviceId
          },
          body: JSON.stringify({ admission_number: admNo, pin })
        });

        const data = await res.json();

        if (res.status === 403) {
          showOverlay('Access Restricted', data.error, true);
          return;
        }

        if (!res.ok) return alert(data.error || 'Authentication failed.');

        currentStudentAdm = admNo.toUpperCase();
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('report-box').style.display = 'block';
      } catch (err) {
        alert('Network connection error.');
      }
    }

    async function submitReport() {
      const category = document.getElementById('category').value;
      const urgency = document.getElementById('urgency').value;
      const description = document.getElementById('description').value.trim();
      const isAnonymous = document.getElementById('is-anonymous').checked;

      if (!description) return alert('Please enter incident details.');

      try {
        const res = await fetch('/api/reports', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-device-id': deviceId
          },
          body: JSON.stringify({
            admission_number: currentStudentAdm,
            device_id: deviceId,
            category,
            urgency,
            description,
            is_anonymous: isAnonymous
          })
        });

        const data = await res.json();

        if (res.status === 403) {
          showOverlay('Access Restricted', data.error, true);
          return;
        }

        if (res.ok) {
          alert('Report submitted successfully.');
          document.getElementById('description').value = '';
          document.getElementById('is-anonymous').checked = false;
        } else {
          alert(data.error || 'Failed to submit report.');
        }
      } catch (err) {
        alert('Failed to connect to server.');
      }
    }

    async function submitAppeal() {
      const reason = document.getElementById('appeal-reason').value.trim();
      const admNo = document.getElementById('adm-no').value.trim() || 'ANONYMOUS';

      if (!reason) return alert('Enter your reason for appeal.');

      try {
        const res = await fetch('/api/request-reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ clientId: admNo, device_id: deviceId, reason })
        });

        if (res.ok) {
          alert('Appeal logged for counselor review.');
          document.getElementById('appeal-reason').value = '';
        }
      } catch (err) {
        alert('Failed to submit appeal.');
      }
    }

    function showOverlay(title, message, showAppeal = false) {
      document.getElementById('overlay-title').innerText = title;
      document.getElementById('overlay-message').innerText = message;
      document.getElementById('appeal-section').style.display = showAppeal ? 'block' : 'none';
      document.getElementById('status-overlay').style.display = 'flex';
    }

    document.addEventListener('DOMContentLoaded', checkSystemState);
  </script>
</body>
</html>
