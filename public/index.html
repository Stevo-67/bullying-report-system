<script>
    // Get or create persistent device ID
    function getClientId() {
        let clientId = localStorage.getItem('safespace_client_id');
        if (!clientId) {
            clientId = 'dev_' + Math.random().toString(36).substring(2, 11) + '_' + Date.now();
            localStorage.setItem('safespace_client_id', clientId);
        }
        return clientId;
    }

    // Check device status on page load
    async function checkDeviceStatus() {
        const clientId = getClientId();
        try {
            const res = await fetch(`/api/client-status/${clientId}`);
            const data = await res.json();

            if (data.status === 'banned') {
                document.body.innerHTML = `
                    <div style="max-width:500px; margin: 80px auto; text-align:center; font-family: sans-serif;">
                        <h2 style="color: #c0392b;">Access Suspended</h2>
                        <p style="color: #555;">This device has been suspended from submitting reports due to policy violations.</p>
                    </div>
                `;
            } else if (data.status === 'warned') {
                const banner = document.createElement('div');
                banner.style.cssText = 'background:#e67e22; color:white; padding:15px; text-align:center; font-weight:bold; font-family:sans-serif; margin-bottom:20px; border-radius:4px;';
                banner.innerText = `⚠️ Counselor Warning: ${data.message}`;
                document.body.insertBefore(banner, document.body.firstChild);
            }
        } catch(e) { console.error('Status check error:', e); }
    }
    checkDeviceStatus();

</script>
