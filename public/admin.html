<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counselor Dashboard - SafeSpace</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 20px; margin: 0; }
        h1 { color: #2c3e50; display: inline-block; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px; border: 1px solid #dee2e6; text-align: left; vertical-align: top; }
        th { background-color: #2c3e50; color: white; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; color: white; }
        .badge-High { background-color: #d9381e; }
        .badge-Medium { background-color: #f39c12; }
        .badge-Low { background-color: #2980b9; }
        
        button.refresh-btn { padding: 8px 16px; background-color: #34495e; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button.logout-btn { padding: 8px 16px; background-color: #7f8c8d; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px; }
        button.notify-btn { padding: 8px 16px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px; }
        button.delete-btn { padding: 4px 8px; background-color: #c0392b; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        button.delete-btn:hover { background-color: #a93226; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        /* Alert banner for new submissions */
        #notificationBanner {
            display: none; background-color: #27ae60; color: white;
            padding: 12px; border-radius: 4px; font-weight: bold; margin-bottom: 15px; text-align: center;
        }

        /* Auth Overlay Styles */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95); display: flex;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .login-card {
            background: white; padding: 30px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; width: 300px;
        }
        .login-card input {
            width: 90%; padding: 10px; font-size: 16px; margin: 15px 0;
            border: 1px solid #ccc; border-radius: 4px; text-align: center;
        }
        .login-card button {
            width: 100%; padding: 10px; background-color: #2c3e50;
            color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;
        }
        #loginError { color: #d9381e; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- PIN Authentication Overlay -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>Counselor Login</h2>
            <p style="font-size: 14px; color: #666;">Enter access PIN to view reports</p>
            <input type="password" id="pinInput" placeholder="Enter PIN" onkeydown="if(event.key==='Enter') submitPin()" />
            <button onclick="submitPin()">Access Portal</button>
            <div id="loginError">Invalid PIN. Please try again.</div>
        </div>
    </div>

    <!-- Protected Portal Content -->
    <div id="portalContent" style="display: none;">
        <div class="header-bar">
            <h1>Counselor Portal</h1>
            <div>
                <button class="notify-btn" onclick="enableDesktopNotifications()">🔔 Enable Desktop Alerts</button>
                <button class="refresh-btn" onclick="loadReports()">Refresh Submissions</button>
                <button class="logout-btn" onclick="logout()">Lock Portal</button>
            </div>
        </div>

        <div id="notificationBanner">🔔 New report received! Table updated.</div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Timestamp (EAT)</th>
                    <th>Student / Category</th>
                    <th>Urgency</th>
                    <th>Description / Request</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="reportsTable"></tbody>
        </table>
    </div>

<script>
    let lastMaxReportId = 0;
    let autoPollInterval = null;

    function getPin() {
        return sessionStorage.getItem('counselor_pin') || '';
    }

    function submitPin() {
        const pin = document.getElementById('pinInput').value;
        sessionStorage.setItem('counselor_pin', pin);
        loadReports();
    }

    function logout() {
        sessionStorage.removeItem('counselor_pin');
        if (autoPollInterval) clearInterval(autoPollInterval);
        document.getElementById('portalContent').style.display = 'none';
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('pinInput').value = '';
    }

    // Audio trigger: Plays the original MP3 audio file
    function playNotificationSound() {
        try {
            const bell = new Audio('/mm_clocktower_bell.mp3');
            bell.volume = 1.0;
            bell.play().catch(e => console.error('Audio playback blocked or failed:', e));
        } catch(e) {
            console.error('Audio trigger error:', e);
        }
    }

    function enableDesktopNotifications() {
        if ("Notification" in window) {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    playNotificationSound();
                    alert("Desktop notifications enabled!");
                }
            });
        }
    }

    async function loadReports() {
        const pin = getPin();
        try {
            const res = await fetch('/api/reports', {
                headers: { 'x-admin-pin': pin }
            });

            if (res.status === 401) {
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('portalContent').style.display = 'none';
                document.getElementById('loginError').style.display = 'block';
                return;
            }

            const reports = await res.json();
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('portalContent').style.display = 'block';
            document.getElementById('loginError').style.display = 'none';

            // Check if new reports arrived since last check
            if (reports.length > 0) {
                const currentMaxId = reports[0].id;
                if (lastMaxReportId !== 0 && currentMaxId > lastMaxReportId) {
                    playNotificationSound();
                    
                    const banner = document.getElementById('notificationBanner');
                    banner.style.display = 'block';
                    setTimeout(() => { banner.style.display = 'none'; }, 5000);

                    if ("Notification" in window && Notification.permission === "granted") {
                        new Notification("SafeSpace Portal Alert", {
                            body: `New ${reports[0].urgency} priority report received!`
                        });
                    }
                }
                lastMaxReportId = currentMaxId;
            }

            const tableBody = document.getElementById('reportsTable');
            tableBody.innerHTML = '';

            reports.forEach(report => {
                let rawDate = report.timestamp ? report.timestamp.replace(' ', 'T') : '';
                if (rawDate && !rawDate.endsWith('Z')) {
                    rawDate += 'Z';
                }

                const formattedDate = rawDate ? new Date(rawDate).toLocaleString('en-US', {
                    timeZone: 'Africa/Nairobi'
                }) : 'N/A';

                const currentStatus = report.status || 'Pending';
                const studentName = report.student_name || report.student || 'Anonymous';
                const categoryName = report.category || 'General';

                const rawUrgency = report.urgency || 'Medium';
                const urgency = rawUrgency.charAt(0).toUpperCase() + rawUrgency.slice(1).toLowerCase();

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${report.id}</td>
                    <td>${formattedDate}</td>
                    <td>
                        <strong>${escapeHtml(studentName)}</strong><br>
                        <small style="color: #6c757d;">Category: ${escapeHtml(categoryName)}</small>
                    </td>
                    <td><span class="badge badge-${urgency}">${escapeHtml(urgency)}</span></td>
                    <td>${escapeHtml(report.description || 'No description provided')}</td>
                    <td>
                        <select onchange="updateStatus(${report.id}, this.value)">
                            <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Under Review" ${currentStatus === 'Under Review' ? 'selected' : ''}>Under Review</option>
                            <option value="Resolved" ${currentStatus === 'Resolved' ? 'selected' : ''}>Resolved</option>
                        </select>
                    </td>
                    <td>
                        <button class="delete-btn" onclick="deleteReport(${report.id})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            // Start auto-polling every 10 seconds if not active
            if (!autoPollInterval) {
                autoPollInterval = setInterval(loadReports, 10000);
            }

        } catch (err) {
            console.error('Failed to load reports:', err);
        }
    }

    async function updateStatus(id, newStatus) {
        try {
            const res = await fetch(`/api/reports/${id}`, {
                method: 'PATCH',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-admin-pin': getPin()
                },
                body: JSON.stringify({ status: newStatus })
            });
            if (!res.ok) throw new Error('Status update failed');
        } catch (err) {
            console.error('Failed to update status:', err);
        }
    }

    async function deleteReport(id) {
        if (!confirm(`Are you sure you want to permanently delete report #${id}?`)) return;

        try {
            const res = await fetch(`/api/reports/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-pin': getPin() }
            });
            if (res.ok) {
                loadReports();
            } else {
                alert('Failed to delete report.');
            }
        } catch (err) {
            console.error('Failed to delete report:', err);
        }
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    if (getPin()) {
        loadReports();
    }
</script>

</body>
</html>
