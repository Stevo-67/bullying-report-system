<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Incident Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.5rem; font-weight: 700; }

    .nav-tabs { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
    .nav-tab { background: var(--card); border: 1px solid var(--border); color: var(--text-muted); padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; font-weight: 600; }
    .nav-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

    .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text-muted); background: var(--card); padding: 0.5rem 1rem; border-radius: 9999px; border: 1px solid var(--border); }
    .indicator { width: 8px; height: 8px; border-radius: 50%; background-color: var(--danger); }
    .indicator.connected { background-color: var(--success); box-shadow: 0 0 8px var(--success); }

    button { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 0.375rem; cursor: pointer; font-weight: 500; }
    button:hover { background: var(--border); }
    button.btn-success { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
    button.btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
    button.btn-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); border-color: rgba(245, 158, 11, 0.3); }

    .table-container { background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.875rem; }
    th { background-color: rgba(0, 0, 0, 0.2); color: var(--text-muted); text-transform: uppercase; font-size: 0.75rem; }
    
    .urgency-high { color: var(--danger); font-weight: 700; }
    .urgency-medium { color: var(--warning); font-weight: 600; }
    .urgency-low { color: var(--primary); }

    select { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 0.375rem 0.5rem; border-radius: 0.25rem; }
    .action-group { display: flex; gap: 0.375rem; }
    .action-group button { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Incident Reports Dashboard</h1>
      <div style="display: flex; gap: 0.75rem;">
        <div class="status-badge">
          <div id="connection-indicator" class="indicator"></div>
          <span id="connection-text">Connecting...</span>
        </div>
        <button onclick="promptAdminPin()">Enter PIN</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('reports-tab', this)">Active Reports</button>
      <button class="nav-tab" onclick="switchTab('appeals-tab', this)">Banned Accounts & Appeals</button>
    </div>

    <!-- TAB 1: REPORTS -->
    <div id="reports-tab" class="tab-content active">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Student ID</th>
              <th>Category / Details</th>
              <th>Urgency</th>
              <th>Submitted At</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reports-table-body">
            <tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Awaiting PIN authentication...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: BANS & APPEALS -->
    <div id="appeals-tab" class="tab-content">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Student Admission No</th>
              <th>Restriction</th>
              <th>Appeal Reason</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="appeals-table-body">
            <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Awaiting PIN authentication...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Volatile memory PIN storage (erased on refresh)
    let adminPin = '';

    // Web Audio API custom notification playback
    let audioCtx;
    let soundBuffer = null;

    function initAudio() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      audioCtx = new AudioContextClass();

      fetch('/notification.mp3')
        .then(res => res.arrayBuffer())
        .then(buf => audioCtx.decodeAudioData(buf))
        .then(decoded => { soundBuffer = decoded; })
        .catch(err => console.error('Sound buffer load error:', err));
    }

    function unlockAudioContext() {
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    document.addEventListener('click', unlockAudioContext, { once: true });
    document.addEventListener('keydown', unlockAudioContext, { once: true });

    function playCustomSound() {
      if (!audioCtx || !soundBuffer) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const source = audioCtx.createBufferSource();
      source.buffer = soundBuffer;
      source.connect(audioCtx.destination);
      source.start(0);
    }

    initAudio();

    // Navigation Tabs
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'appeals-tab') fetchBannedClients();
      else fetchReports();
    }

    // Live Stream SSE
    function startNotificationStream() {
      const indicator = document.getElementById('connection-indicator');
      const text = document.getElementById('connection-text');
      const eventSource = new EventSource('/api/events');

      eventSource.onopen = () => {
        indicator.classList.add('connected');
        text.innerText = 'Live Feed Connected';
      };

      eventSource.onmessage = (event) => {
        try {
          const report = JSON.parse(event.data);
          playCustomSound();

          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`🚨 New Incident Report`, {
              body: `Student: ${report.student_name}\nCategory: ${report.category}`,
              icon: '/favicon.ico'
            });
          }

          if (adminPin) fetchReports();
        } catch (err) {
          console.error('SSE parsing error:', err);
        }
      };

      eventSource.onerror = () => {
        indicator.classList.remove('connected');
        text.innerText = 'Reconnecting...';
        eventSource.close();
        setTimeout(startNotificationStream, 3000);
      };
    }

    // Authenticated Fetch Helper
    async function adminFetch(url, options = {}) {
      options.headers = {
        ...options.headers,
        'Content-Type': 'application/json',
        'x-admin-pin': adminPin
      };

      const res = await fetch(url, options);
      if (res.status === 401) {
        promptAdminPin();
        throw new Error('Unauthorized');
      }
      return res.json();
    }

    function promptAdminPin() {
      const input = prompt('Enter Admin PIN:');
      if (input) {
        adminPin = input;
        fetchReports();
      }
    }

    // Reports Table Render
    async function fetchReports() {
      if (!adminPin) return;
      try {
        const reports = await adminFetch('/api/reports');
        renderReportsTable(reports);
      } catch (err) {
        console.error('Error fetching reports:', err);
      }
    }

    function renderReportsTable(reports) {
      const tbody = document.getElementById('reports-table-body');
      if (!reports || reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--text-muted);">No reports found.</td></tr>';
        return;
      }

      tbody.innerHTML = reports.map(r => {
        const formattedTime = r.timestamp 
          ? new Date(r.timestamp).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })
          : 'Unknown';

        return `
          <tr>
            <td>#${r.id}</td>
            <td><strong>${escapeHtml(r.admission_number)}</strong></td>
            <td>
              <strong>${escapeHtml(r.category)}</strong><br>
              <span style="color: var(--text-muted); font-size: 0.75rem;">${escapeHtml(r.description)}</span>
            </td>
            <td><span class="urgency-${String(r.urgency).toLowerCase()}">${escapeHtml(r.urgency)}</span></td>
            <td><span style="color: var(--text-muted); font-size: 0.8rem;">${formattedTime}</span></td>
            <td>
              <select onchange="updateStatus(${r.id}, this.value)">
                <option value="Pending" ${r.status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="In Progress" ${r.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                <option value="Resolved" ${r.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
              </select>
            </td>
            <td>
              <div class="action-group">
                <button class="btn-warning" onclick="resetStudentPin('${escapeHtml(r.admission_number)}')">Reset PIN</button>
                <button class="btn-danger" onclick="applyBan(${r.id})">Ban Account</button>
                <button onclick="deleteReport(${r.id})">Delete</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Bans & Appeals Table Render
    async function fetchBannedClients() {
      if (!adminPin) return;
      try {
        const data = await adminFetch('/api/banned-clients');
        renderAppealsTable(data.bans, data.reset_requests);
      } catch (err) {
        console.error('Error fetching bans:', err);
      }
    }

    function renderAppealsTable(bans, resetRequests) {
      const tbody = document.getElementById('appeals-table-body');
      if (!bans || bans.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">No banned student accounts.</td></tr>';
        return;
      }

      const requestMap = {};
      (resetRequests || []).forEach(req => { requestMap[req.client_id] = req.reason; });

      tbody.innerHTML = bans.map(b => `
        <tr>
          <td><strong>${escapeHtml(b.client_id)}</strong></td>
          <td><span style="color: var(--danger); font-weight:600;">Account Banned</span></td>
          <td>${escapeHtml(requestMap[b.client_id] || 'No appeal submitted yet.')}</td>
          <td>${new Date(b.timestamp).toLocaleString()}</td>
          <td>
            <button class="btn-success" onclick="unbanStudent('${escapeHtml(b.client_id)}')">Unban Account</button>
          </td>
        </tr>
      `).join('');
    }

    // Counselor Actions
    async function resetStudentPin(admissionNumber) {
      if (confirm(`Reset PIN for ${admissionNumber}? They will create a new PIN on next login.`)) {
        await adminFetch('/api/admin/reset-pin', {
          method: 'POST',
          body: JSON.stringify({ admission_number: admissionNumber })
        });
        alert(`PIN for ${admissionNumber} has been reset.`);
      }
    }

    async function applyBan(id) {
      if (confirm('Ban this student account across all devices?')) {
        await adminFetch(`/api/reports/${id}/ban`, { method: 'POST' });
        fetchReports();
      }
    }

    async function unbanStudent(clientId) {
      if (confirm(`Unban student account ${clientId}?`)) {
        await adminFetch('/api/unban', {
          method: 'POST',
          body: JSON.stringify({ clientId })
        });
        fetchBannedClients();
      }
    }

    async function updateStatus(id, status) {
      await adminFetch(`/api/reports/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
    }

    async function deleteReport(id) {
      if (confirm('Delete report entry?')) {
        await adminFetch(`/api/reports/${id}`, { method: 'DELETE' });
        fetchReports();
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
      startNotificationStream();
      promptAdminPin();
    });
  </script>
</body>
</html>
