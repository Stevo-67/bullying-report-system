<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Incident Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      background: var(--card);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
    }

    .indicator.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
    }

    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--border);
    }

    button.btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    button.btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    button.btn-warning {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning);
      border-color: rgba(245, 158, 11, 0.3);
    }

    button.btn-warning:hover {
      background: var(--warning);
      color: white;
    }

    .table-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }

    th {
      background-color: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr.quarantined-row {
      background-color: rgba(245, 158, 11, 0.05);
    }

    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }

    .badge.shadow {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .urgency-high {
      color: var(--danger);
      font-weight: 700;
    }

    .urgency-medium {
      color: var(--warning);
      font-weight: 600;
    }

    .urgency-low {
      color: var(--primary);
    }

    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.375rem 0.5rem;
      border-radius: 0.25rem;
      outline: none;
    }

    .action-group {
      display: flex;
      gap: 0.375rem;
    }

    .action-group button {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Incident Reports Dashboard</h1>
      </div>
      <div class="header-actions">
        <div class="status-badge">
          <div id="connection-indicator" class="indicator"></div>
          <span id="connection-text">Connecting...</span>
        </div>
        <button onclick="changePin()">Change PIN</button>
      </div>
    </header>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Category / Student</th>
            <th>Description</th>
            <th>Urgency</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="reports-table-body">
          <tr>
            <td colspan="6" style="text-align: center; color: var(--text-muted);">Loading incidents...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let adminPin = localStorage.getItem('adminPin') || '';
    
    // Uses your local audio asset inside public/ (change path/filename if different)
    const alertAudio = new Audio('/notification.mp3');

    // Unlock audio context on initial page click
    document.addEventListener('click', () => {
      alertAudio.load();
    }, { once: true });

    // Request browser notification permissions
    function initNotificationPermissions() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    // Connect to SSE Live Stream for Instant Notifications
    function startNotificationStream() {
      const indicator = document.getElementById('connection-indicator');
      const text = document.getElementById('connection-text');

      const eventSource = new EventSource('/api/events');

      eventSource.onopen = () => {
        indicator.classList.add('connected');
        text.innerText = 'Live Feed Connected';
      };

      eventSource.onmessage = (event) => {
        try {
          const report = JSON.parse(event.data);

          // 1. Play chime
          alertAudio.play().catch(() => {});

          // 2. Show system desktop notification
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`🚨 New ${report.urgency} Urgency Incident`, {
              body: `Category: ${report.category}\nStudent: ${report.student_name}\n"${report.description}"`,
              icon: '/favicon.ico',
              requireInteraction: String(report.urgency).toLowerCase() === 'high'
            });
          }

          // 3. Refresh reports list on dashboard automatically
          fetchReports();
        } catch (err) {
          console.error('Error handling event:', err);
        }
      };

      eventSource.onerror = () => {
        indicator.classList.remove('connected');
        text.innerText = 'Reconnecting...';
        eventSource.close();
        setTimeout(startNotificationStream, 3000);
      };
    }

    // Helper for API calls requiring PIN
    async function adminFetch(url, options = {}) {
      options.headers = {
        ...options.headers,
        'Content-Type': 'application/json',
        'x-admin-pin': adminPin
      };

      const res = await fetch(url, options);
      if (res.status === 401) {
        promptAdminPin();
        throw new Error('Unauthorized');
      }
      return res.json();
    }

    function promptAdminPin() {
      const input = prompt('Enter Admin PIN:');
      if (input) {
        adminPin = input;
        localStorage.setItem('adminPin', adminPin);
        fetchReports();
      }
    }

    function changePin() {
      localStorage.removeItem('adminPin');
      adminPin = '';
      promptAdminPin();
    }

    // Fetch and render reports list
    async function fetchReports() {
      try {
        const reports = await adminFetch('/api/reports');
        renderTable(reports);
      } catch (err) {
        console.error('Error fetching reports:', err);
      }
    }

    function renderTable(reports) {
      const tbody = document.getElementById('reports-table-body');

      if (!reports || reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">No incident reports found.</td></tr>';
        return;
      }

      tbody.innerHTML = reports.map(r => `
        <tr class="${r.is_quarantined ? 'quarantined-row' : ''}">
          <td>#${r.id}</td>
          <td>
            <strong>${escapeHtml(r.category)}</strong><br>
            <span style="color: var(--text-muted); font-size: 0.75rem;">${escapeHtml(r.student_name)}</span>
            ${r.is_quarantined ? '<br><span class="badge shadow">Shadow Banned</span>' : ''}
          </td>
          <td>${escapeHtml(r.description)}</td>
          <td><span class="urgency-${String(r.urgency).toLowerCase()}">${escapeHtml(r.urgency)}</span></td>
          <td>
            <select onchange="updateStatus(${r.id}, this.value)">
              <option value="Pending" ${r.status === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="In Progress" ${r.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option value="Resolved" ${r.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
            </select>
          </td>
          <td>
            <div class="action-group">
              <button class="btn-warning" onclick="issueWarning(${r.id})">Warn</button>
              <button class="btn-danger" onclick="applyBan(${r.id}, '24h')">24h Ban</button>
              <button class="btn-danger" onclick="applyBan(${r.id}, 'shadow')">Shadow Ban</button>
              <button onclick="deleteReport(${r.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(id, status) {
      await adminFetch(`/api/reports/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ status })
      });
    }

    async function issueWarning(id) {
      const message = prompt('Warning message to deliver to this student device:', 'Warning: Submitting false or improper reports violates school policy.');
      if (message) {
        await adminFetch(`/api/reports/${id}/warn`, {
          method: 'POST',
          body: JSON.stringify({ message })
        });
        alert('Warning issued.');
      }
    }

    async function applyBan(id, banType) {
      if (confirm(`Apply ${banType === '24h' ? '24-Hour Cooldown' : 'Shadow Ban'} to this device?`)) {
        await adminFetch(`/api/reports/${id}/ban`, {
          method: 'POST',
          body: JSON.stringify({ banType })
        });
        fetchReports();
      }
    }

    async function deleteReport(id) {
      if (confirm('Delete this report entry permanently?')) {
        await adminFetch(`/api/reports/${id}`, { method: 'DELETE' });
        fetchReports();
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      initNotificationPermissions();
      startNotificationStream();

      if (!adminPin) {
        promptAdminPin();
      } else {
        fetchReports();
      }
    });
  </script>
</body>
</html>
