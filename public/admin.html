<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Incident Portal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .nav-tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .nav-tab {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 600;
    }

    .nav-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      background: var(--card);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
    }

    .indicator.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .header-actions {
      display: flex;
      gap: 0.75rem;
    }

    button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover {
      background: var(--border);
    }

    button.btn-success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    button.btn-success:hover {
      background: var(--success);
      color: white;
    }

    button.btn-danger {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.3);
    }

    button.btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    button.btn-warning {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning);
      border-color: rgba(245, 158, 11, 0.3);
    }

    button.btn-warning:hover {
      background: var(--warning);
      color: white;
    }

    .table-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.875rem;
    }

    th {
      background-color: rgba(0, 0, 0, 0.2);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr.quarantined-row {
      background-color: rgba(245, 158, 11, 0.05);
    }

    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-block;
    }

    .badge.shadow {
      background: rgba(245, 158, 11, 0.2);
      color: var(--warning);
    }

    .badge.cooldown {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
    }

    .urgency-high { color: var(--danger); font-weight: 700; }
    .urgency-medium { color: var(--warning); font-weight: 600; }
    .urgency-low { color: var(--primary); }

    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.375rem 0.5rem;
      border-radius: 0.25rem;
      outline: none;
    }

    .action-group {
      display: flex;
      gap: 0.375rem;
    }

    .action-group button {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Incident Reports Dashboard</h1>
      </div>
      <div class="header-actions">
        <div class="status-badge">
          <div id="connection-indicator" class="indicator"></div>
          <span id="connection-text">Connecting...</span>
        </div>
        <button onclick="changePin()">Change PIN</button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('reports-tab', this)">Active Reports</button>
      <button class="nav-tab" onclick="switchTab('appeals-tab', this)">Banned Devices & Appeals</button>
    </div>

    <!-- TAB 1: REPORTS -->
    <div id="reports-tab" class="tab-content active">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Category / Student</th>
              <th>Description</th>
              <th>Urgency</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="reports-table-body">
            <tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Loading incidents...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: BANNED DEVICES & APPEALS -->
    <div id="appeals-tab" class="tab-content">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Client ID / IP</th>
              <th>Restriction Type</th>
              <th>Appeal Reason</th>
              <th>Date Banned</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="appeals-table-body">
            <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading banned records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let adminPin = localStorage.getItem('adminPin') || '';

    // Custom Audio File Setup
    const alertAudio = new Audio('/notification.mp3');
    alertAudio.preload = 'auto';

    // Browser Autoplay Unlock Handling
    let isAudioUnlocked = false;
    function unlockAudio() {
      if (isAudioUnlocked) return;
      alertAudio.play().then(() => {
        alertAudio.pause();
        alertAudio.currentTime = 0;
        isAudioUnlocked = true;
      }).catch(() => {});
    }

    document.addEventListener('click', unlockAudio, { once: true });
    document.addEventListener('keydown', unlockAudio, { once: true });

    function playCustomSound() {
      alertAudio.currentTime = 0;
      alertAudio.play().catch(err => {
        console.warn('Audio playback blocked by browser:', err);
      });
    }

    // Tab Navigation
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');

      if (tabId === 'appeals-tab') fetchBannedClients();
      else fetchReports();
    }

    // Notifications & SSE Live Stream
    function initNotificationPermissions() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function startNotificationStream() {
      const indicator = document.getElementById('connection-indicator');
      const text = document.getElementById('connection-text');

      const eventSource = new EventSource('/api/events');

      eventSource.onopen = () => {
        indicator.classList.add('connected');
        text.innerText = 'Live Feed Connected';
      };

      eventSource.onmessage = (event) => {
        try {
          const report = JSON.parse(event.data);

          // Play custom sound file
          playCustomSound();

          // Show desktop notification
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`🚨 New ${report.urgency} Urgency Incident`, {
              body: `Category: ${report.category}\nStudent: ${report.student_name}\n"${report.description}"`,
              icon: '/favicon.ico',
              requireInteraction: String(report.urgency).toLowerCase() === 'high'
            });
          }

          fetchReports();
        } catch (err) {
          console.error('Error handling event:', err);
        }
      };

      eventSource.onerror = () => {
        indicator.classList.remove('connected');
        text.innerText = 'Reconnecting...';
        eventSource.close();
        setTimeout(startNotificationStream, 3000);
      };
    }

    // Admin Authentication & API Calls
    async function adminFetch(url, options = {}) {
      options.headers = {
        ...options.headers,
        'Content-Type': 'application/json',
        'x-admin-pin': adminPin
      };

      const res = await fetch(url, options);
      if (res.status === 401) {
        promptAdminPin();
        throw new Error('Unauthorized');
      }
      return res.json();
    }

    function promptAdminPin() {
      const input = prompt('Enter Admin PIN:');
      if (input) {
        adminPin = input;
        localStorage.setItem('adminPin', adminPin);
        fetchReports();
      }
    }

    function changePin() {
      localStorage.removeItem('adminPin');
      adminPin = '';
      promptAdminPin();
    }

    // Render Active Reports Tab
    async function fetchReports() {
      try {
        const reports = await adminFetch('/api/reports');
        renderReportsTable(reports);
      } catch (err) {
        console.error('Error fetching reports:', err);
      }
    }

    function renderReportsTable(reports) {
      const tbody = document.getElementById('reports-table-body');
      if (!reports || reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted);">No incident reports found.</td></tr>';
        return;
      }

      tbody.innerHTML = reports.map(r => `
        <tr class="${r.is_quarantined ? 'quarantined-row' : ''}">
          <td>#${r.id}</td>
          <td>
            <strong>${escapeHtml(r.category)}</strong><br>
            <span style="color: var(--text-muted); font-size: 0.75rem;">${escapeHtml(r.student_name)}</span>
            ${r.is_quarantined ? '<br><span class="badge shadow">Shadow Banned</span>' : ''}
            ${r.has_reset_request ? '<br><span class="badge cooldown">Submitted Appeal</span>' : ''}
          </td>
          <td>${escapeHtml(r.description)}</td>
          <td><span class="urgency-${String(r.urgency).toLowerCase()}">${escapeHtml(r.urgency)}</span></td>
          <td>
            <select onchange="updateStatus(${r.id}, this.value)">
              <option value="Pending" ${r.status === 'Pending' ? 'selected' : ''}>Pending</option>
              <option value="In Progress" ${r.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option value="Resolved" ${r.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
            </select>
          </td>
          <td>
            <div class="action-group">
              <button class="btn-warning" onclick="issueWarning(${r.id})">Warn</button>
              <button class="btn-danger" onclick="applyBan(${r.id}, '24h')">24h Ban</button>
              <button class="btn-danger" onclick="applyBan(${r.id}, 'shadow')">Shadow Ban</button>
              <button onclick="deleteReport(${r.id})">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    // Render Banned Devices & Appeals Tab
    async function fetchBannedClients() {
      try {
        const data = await adminFetch('/api/banned-clients');
        renderAppealsTable(data.bans, data.reset_requests);
      } catch (err) {
        console.error('Error fetching banned records:', err);
      }
    }

    function renderAppealsTable(bans, resetRequests) {
      const tbody = document.getElementById('appeals-table-body');
      if (!bans || bans.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">No active bans or restrictions.</td></tr>';
        return;
      }

      const requestMap = {};
      (resetRequests || []).forEach(req => { requestMap[req.client_id] = req.reason; });

      tbody.innerHTML = bans.map(b => `
        <tr>
          <td>
            <strong>${escapeHtml(b.client_id)}</strong><br>
            <span style="color: var(--text-muted); font-size: 0.75rem;">IP: ${escapeHtml(b.ip || 'Unknown')}</span>
          </td>
          <td>
            <span class="badge ${b.ban_type === '24h' ? 'cooldown' : 'shadow'}">
              ${b.ban_type === '24h' ? '24h Cooldown' : 'Shadow Ban'}
            </span>
          </td>
          <td>${escapeHtml(requestMap[b.client_id] || 'No appeal submitted yet.')}</td>
          <td>${new Date(b.timestamp).toLocaleString()}</td>
          <td>
            <button class="btn-success" onclick="unbanDevice('${escapeHtml(b.client_id)}')">Undo Ban / Unban</button>
          </td>
        </tr>
      `).join('');
    }

    // Incident Actions
    async function unbanDevice(clientId) {
      if (confirm(`Unban device ${clientId} and restore access?`)) {
        await adminFetch('/api/unban', {
          method: 'POST',
          body: JSON.stringify({ clientId })
        });
        fetchBannedClients();
      }
    }

    async function updateStatus(id, status) {
      await adminFetch(`/api/reports/${id}`, { method: 'PATCH', body: JSON.stringify({ status }) });
    }

    async function issueWarning(id) {
      const message = prompt('Warning message:', 'Warning: Submitting false reports violates school policy.');
      if (message) {
        await adminFetch(`/api/reports/${id}/warn`, { method: 'POST', body: JSON.stringify({ message }) });
        alert('Warning issued.');
      }
    }

    async function applyBan(id, banType) {
      if (confirm(`Apply ${banType === '24h' ? '24-Hour Cooldown' : 'Shadow Ban'} to this device?`)) {
        await adminFetch(`/api/reports/${id}/ban`, { method: 'POST', body: JSON.stringify({ banType }) });
        fetchReports();
      }
    }

    async function deleteReport(id) {
      if (confirm('Delete this report entry permanently?')) {
        await adminFetch(`/api/reports/${id}`, { method: 'DELETE' });
        fetchReports();
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initNotificationPermissions();
      startNotificationStream();

      if (!adminPin) {
        promptAdminPin();
      } else {
        fetchReports();
      }
    });
  </script>
</body>
</html>
